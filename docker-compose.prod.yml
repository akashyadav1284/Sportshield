# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SportShield AI — Production Docker Compose
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Prerequisites:
#   - Copy .env.example → .env and fill in production secrets
#   - Ensure ports 80 and 443 are available
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

services:
  # ── PostgreSQL Database ──
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sportshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sportshield}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sportshield}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Redis Cache & Message Broker ──
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M

  # ── FastAPI Backend (Gunicorn + Uvicorn) ──
  backend:
    build: ./backend
    restart: always
    env_file: .env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sportshield}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sportshield}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-sportshield}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sportshield}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - uploads:/app/uploads
      - faiss_data:/app/faiss_data
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      gunicorn app.main:app
      --bind 0.0.0.0:8000
      --workers 4
      --worker-class uvicorn.workers.UvicornWorker
      --timeout 120
      --graceful-timeout 30
      --access-logfile -
      --error-logfile -
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

  # ── Celery Worker (AI Processing) ──
  worker:
    build: ./backend
    restart: always
    env_file: .env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sportshield}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sportshield}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-sportshield}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sportshield}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - uploads:/app/uploads
      - faiss_data:/app/faiss_data
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=50
      --without-heartbeat
    deploy:
      resources:
        limits:
          memory: 4G

  # ── Celery Beat Scheduler ──
  beat:
    build: ./backend
    restart: always
    env_file: .env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sportshield}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sportshield}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-sportshield}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sportshield}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.tasks.celery_app beat
      --scheduler redbeat.RedBeatScheduler
      --loglevel=info
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Frontend (Production Static Build) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Nginx Reverse Proxy ──
  nginx:
    build: ./nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
    depends_on:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Certbot (Let's Encrypt) — activate when domain is ready ──
  # certbot:
  #   image: certbot/certbot
  #   volumes:
  #     - certbot_conf:/etc/letsencrypt
  #     - certbot_www:/var/www/certbot
  #   command: certonly --webroot -w /var/www/certbot --email admin@yourdomain.com -d yourdomain.com --agree-tos --no-eff-email
  #   depends_on:
  #     - nginx

volumes:
  pgdata:
  redisdata:
  uploads:
  faiss_data:
  huggingface_cache:
  certbot_conf:
  certbot_www:
